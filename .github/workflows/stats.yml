name: stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

concurrency: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Count stats
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_AUTHORS: ${{ secrets.STATS_AUTHORS }}
          STATS_EXCLUDE: ${{ vars.STATS_EXCLUDE }}
        run: |
          if [ -z "$STATS_TOKEN" ] || [ -z "$STATS_AUTHORS" ]; then
            echo "::warning::STATS_TOKEN or STATS_AUTHORS secret is missing, skipping"
            exit 0
          fi
          python scripts/test_stats.py
          python scripts/stats.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/numbers.svg stats.json
          git diff --cached --quiet || { git commit -m "Update profile stats" && git push; }
